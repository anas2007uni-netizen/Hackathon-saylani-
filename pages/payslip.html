<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HCM Lite - Payslip</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/theme.css">
  <!-- Font Awesome Icons for professional look -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="navbar">
    <a class="logo" href="dashboard.html">HCM Lite</a>
    <nav class="nav-links">
      <a href="dashboard.html" class="nav-item">Dashboard</a><a href="employee.html" class="nav-item">Employees</a><a href="leave.html" class="nav-item">Leaves</a><a href="setting.html" class="nav-item">Settings</a><a href="payslip.html" class="nav-item active">Payslip</a><a href="password.html" class="nav-item">Password</a><a href="login.html" class="nav-item logout">Logout</a>
    </nav>
  </header>

  <!-- Main Content Container -->
  <main class="main-container">
    <div class="card">
      <div class="filter-grid">
        <!-- Month Selector -->
        <div class="form-group">
          <label for="month-select">Month</label>
          <div class="input-icon-wrapper">
            <input type="month" id="month-select" value="2026-10">
          </div>
        </div>

        <!-- Employee Selector -->
        <div class="form-group">
          <label for="employee-select">Employee</label>
          <select id="employee-select">
            <option value="" disabled selected>Select an employee...</option>
            <option value="1">Muhammad Ali</option>
            <option value="2">Ahmed Khan</option>
            <option value="3">Sara Ahmed</option>
          </select>
        </div>

        <!-- Action Button -->
        <div class="form-group button-group">
          <button class="btn-primary" onclick="window.print()">
            <i class="fa-solid fa-print"></i> Print / Save PDF
          </button>
        </div>
      </div>

      <!-- Content Area / Placeholder -->
      <div class="payslip-placeholder">
        <div class="info-box">
          <i class="fa-solid fa-circle-info"></i>
          <p>Add an employee and pick a month to see a payslip.</p>
        </div>
      </div>
    </div>
  </main>

</body>
</html>
