<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HCM Lite - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/theme.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth">
  <div class="auth-card">
    <div class="avatar-circle"><i class="fa-solid fa-lock"></i></div>
    <div class="divider">HCM LITE LOGIN</div>
    <form action="dashboard.html">
      <div class="form-group"><label for="email">Email</label>
        <input type="email" id="email" placeholder="name@company.com" required></div>
      <div class="form-group"><label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required></div>
      <button type="submit" class="btn">Login</button>
    </form>
    <p class="auth-link">Naya account? <a href="../index.html">Create company</a></p>
  </div>
</body>
</html>
