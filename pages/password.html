<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HCM Lite - Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/theme.css">
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="navbar">
    <a class="logo" href="dashboard.html">HCM Lite</a>
    <nav class="nav-links">
      <a href="dashboard.html" class="nav-item">Dashboard</a><a href="employee.html" class="nav-item">Employees</a><a href="leave.html" class="nav-item">Leaves</a><a href="setting.html" class="nav-item">Settings</a><a href="payslip.html" class="nav-item">Payslip</a><a href="password.html" class="nav-item active">Password</a><a href="login.html" class="nav-item logout">Logout</a>
    </nav>
  </header>

  <!-- Clean Normal Main Page -->
  <main class="container">
    <div class="card">
      <h2 class="card-title">Password Security</h2>
      <p class="card-desc">Click the Password menu above anytime to update your credentials.</p>
    </div>
  </main>

  <!-- Exact Browser-style Prompt Popup (No full dark/white background overlay) -->
  <div class="prompt-modal">
    <h3 class="prompt-title">This page says</h3>
    <p class="prompt-label">Current password:</p>
    
    <div class="prompt-input-wrapper">
      <input type="password" autofocus>
    </div>

    <div class="prompt-buttons">
      <button type="button" class="btn-prompt btn-ok">OK</button>
      <button type="button" class="btn-prompt btn-cancel">Cancel</button>
    </div>
  </div>

</body>
</html>
